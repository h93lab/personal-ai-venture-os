services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-venture_os}
      MYSQL_USER: ${MYSQL_USER:-venture_os}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command: ["mysqld", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - venture_os_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-venture_os}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-venture_os}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    command: ["sh", "-c", "corepack pnpm exec drizzle-kit migrate && node dist/index.js"]

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://${MYSQL_USER:-venture_os}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-venture_os}
      SCHEDULER_BASE_URL: http://app:3000
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    command: ["sh", "-c", "while true; do node scripts/cron-runner.mjs || true; sleep 60; done"]

volumes:
  venture_os_mysql:
